<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image motion sketches</title>
    <style>
      @font-face {
        font-family: 'Instrument Sans';
        src: url('/fonts/InstrumentSans-Regular.ttf') format('truetype');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Instrument Sans';
        src: url('/fonts/InstrumentSans-SemiBold.ttf') format('truetype');
        font-weight: 600;
      }
      @font-face {
        font-family: 'Instrument Sans';
        src: url('/fonts/InstrumentSans-Bold.ttf') format('truetype');
        font-weight: 700;
      }
      :root {
        --bg: #0a0a0b;
        --panel: #101011;
        --line: #1f1f22;
        --line-strong: #2c2c30;
        --text: #ededee;
        --muted: #8b8b90;
        --faint: #5d5d62;
        --acid: #c7ff00;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 400 14px/1.45 'Instrument Sans', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 40px 24px 80px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: -0.02em;
      }
      .lede {
        max-width: 62ch;
        margin: 0 0 28px;
        color: var(--muted);
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 20px;
        margin: 0 -24px 28px;
        padding: 12px 24px;
        background: color-mix(in srgb, var(--bg) 92%, transparent);
        border-block: 1px solid var(--line);
        backdrop-filter: blur(8px);
      }
      .group {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .group > span {
        color: var(--muted);
        font-size: 12px;
      }
      button,
      .file {
        height: 30px;
        padding: 0 12px;
        border: 1px solid var(--line-strong);
        border-radius: 7px;
        background: var(--panel);
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      button:hover,
      .file:hover {
        color: var(--text);
      }
      button[aria-pressed='true'] {
        background: var(--text);
        border-color: var(--text);
        color: #0a0a0b;
      }
      .file {
        display: inline-flex;
        align-items: center;
      }
      .file input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
      }
      input[type='range'] {
        width: 120px;
        accent-color: var(--acid);
      }
      h2 {
        margin: 44px 0 6px;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      h2:first-child {
        margin-top: 0;
      }
      .sub {
        margin: 0 0 20px;
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
        gap: 28px 24px;
      }
      figure {
        margin: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: auto;
        border-radius: 4px;
        background: var(--panel);
      }
      figcaption {
        padding-top: 12px;
      }
      figcaption b {
        display: block;
        font-weight: 600;
        font-size: 15px;
      }
      figcaption i {
        font-style: normal;
        color: var(--acid);
        font-size: 12px;
      }
      figcaption p {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 13px;
      }
      @media (prefers-reduced-motion: reduce) {
        .note-motion {
          display: block;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Image motion sketches</h1>
      <p class="lede">
        Ways an effect can move through a still photo. The photo never moves. Each one loops, and each borrows from the type: a soft band that crosses the frame like the Wave, or a pulse like Breathe. These are low-resolution studies, separate from the tool.
      </p>

      <div class="bar">
        <div class="group">
          <label class="file"><input id="file" type="file" accept="image/*" />Try your own photo</label>
        </div>
        <div class="group" id="ramps"><span>Ramp</span></div>
        <div class="group" id="grounds"><span>Ground</span></div>
        <div class="group">
          <span>Speed</span>
          <input id="speed" type="range" min="0.25" max="2" step="0.05" value="1" aria-label="Speed" />
        </div>
        <div class="group">
          <button id="play" type="button" aria-pressed="false">Pause</button>
        </div>
      </div>

      <div id="groups"></div>
    </main>

    <script>
      const W = 360
      const H = 450
      const N = W * H
      const LOOP = 5

      const RAMPS = [
        { id: 'Violet', lo: [150, 143, 193], hi: [251, 250, 252] },
        { id: 'Clay', lo: [172, 153, 121], hi: [255, 252, 245] },
        { id: 'Acid', lo: [27, 31, 0], hi: [199, 255, 0] },
        { id: 'Mono', lo: [0, 0, 0], hi: [255, 255, 255] },
      ]
      let ramp = RAMPS[0]
      const GROUNDS = [
        { id: 'Acid', rgb: [199, 255, 0] },
        { id: 'Clay', rgb: [180, 164, 138] },
        { id: 'Violet', rgb: [150, 143, 193] },
        { id: 'White', rgb: [255, 255, 255] },
        { id: 'Black', rgb: [0, 0, 0] },
      ]
      let ground = GROUNDS[0].rgb

      // Per-photo fields, all luminance 0..1 at sketch resolution.
      let L = new Float32Array(N)
      let soft = new Float32Array(N) // gentle blur, for the focus pass
      let clay = new Float32Array(N) // heavy blur, the first half of the type's recipe
      const grain = new Float32Array(N) // smooth noise that gives the travelling edge its clay outline

      const clamp = (v) => (v < 0 ? 0 : v > 1 ? 1 : v)
      const step = (e0, e1, v) => {
        const t = clamp((v - e0) / (e1 - e0))
        return t * t * (3 - 2 * t)
      }

      function blur(src, radius) {
        let a = Float32Array.from(src)
        let b = new Float32Array(N)
        for (let pass = 0; pass < 3; pass++) {
          for (let y = 0; y < H; y++) {
            let sum = 0
            for (let x = -radius; x <= radius; x++) sum += a[y * W + Math.min(W - 1, Math.max(0, x))]
            for (let x = 0; x < W; x++) {
              b[y * W + x] = sum / (radius * 2 + 1)
              sum += a[y * W + Math.min(W - 1, x + radius + 1)] - a[y * W + Math.max(0, x - radius)]
            }
          }
          for (let x = 0; x < W; x++) {
            let sum = 0
            for (let y = -radius; y <= radius; y++) sum += b[Math.min(H - 1, Math.max(0, y)) * W + x]
            for (let y = 0; y < H; y++) {
              a[y * W + x] = sum / (radius * 2 + 1)
              sum += b[Math.min(H - 1, y + radius + 1) * W + x] - b[Math.max(0, y - radius) * W + x]
            }
          }
        }
        return a
      }

      // Smooth value noise, two octaves, fixed seed: the edge is the same every loop.
      ;(() => {
        const hash = (x, y) => {
          const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453
          return s - Math.floor(s)
        }
        const at = (x, y) => {
          const xi = Math.floor(x)
          const yi = Math.floor(y)
          const fx = x - xi
          const fy = y - yi
          const u = fx * fx * (3 - 2 * fx)
          const v = fy * fy * (3 - 2 * fy)
          return (hash(xi, yi) * (1 - u) + hash(xi + 1, yi) * u) * (1 - v) + (hash(xi, yi + 1) * (1 - u) + hash(xi + 1, yi + 1) * u) * v
        }
        for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) grain[y * W + x] = at(x / 70, y / 70) * 0.65 + at(x / 28 + 9, y / 28 + 4) * 0.35
      })()

      function setPhoto(img) {
        const c = document.createElement('canvas')
        c.width = W
        c.height = H
        const ctx = c.getContext('2d', { willReadFrequently: true })
        const s = Math.max(W / img.width, H / img.height)
        ctx.drawImage(img, (W - img.width * s) / 2, (H - img.height * s) / 2, img.width * s, img.height * s)
        const d = ctx.getImageData(0, 0, W, H).data
        let min = 1
        let max = 0
        for (let i = 0; i < N; i++) {
          L[i] = (d[i * 4] * 0.2126 + d[i * 4 + 1] * 0.7152 + d[i * 4 + 2] * 0.0722) / 255
          if (L[i] < min) min = L[i]
          if (L[i] > max) max = L[i]
        }
        // Stretch to the full range, so an already tinted photo behaves like a black and white original.
        for (let i = 0; i < N; i++) L[i] = (L[i] - min) / Math.max(0.001, max - min)
        soft = blur(L, 4)
        clay = blur(L, 9)
      }

      // The travelling band, the same shape the type's Wave uses: it starts and ends fully outside the frame.
      function band(x, phase, width) {
        const cx = -2.6 * width + phase * (W + 5.2 * width)
        const d = (x - cx) / width
        return Math.exp(-d * d)
      }

      const TAU = Math.PI * 2
      /** 0 at the ends of the loop, 1 in the middle, eased: the shape of every pulse here. */
      const swell = (p) => 0.5 - 0.5 * Math.cos(p * TAU)
      /** A pulse that rises, holds near the top, and falls, so the coloured state gets time on screen. */
      const hold = (p) => step(0.08, 0.38, p) * (1 - step(0.62, 0.92, p))

      /**
       * Each sketch returns, per pixel: a tone 0..1, how much of the gradient map to apply (0 is black
       * and white, 1 is the full ramp), and optionally how far to lean toward the next ramp in the list.
       */
      // Ink bleed: a handful of spots at fixed, seeded places. Each one spreads and draws back on its own
      // beat, and its edge is pushed around by noise so it feathers like ink in wet paper, not like a disc.
      const fine = new Float32Array(N)
      ;(() => {
        const hash = (x, y) => {
          const v = Math.sin(x * 269.5 + y * 183.3) * 43758.5453
          return v - Math.floor(v)
        }
        const raw = new Float32Array(N)
        for (let i = 0; i < N; i++) raw[i] = hash(i % W, Math.floor(i / W))
        fine.set(blur(raw, 3))
        let min = 1
        let max = 0
        for (let i = 0; i < N; i++) {
          if (fine[i] < min) min = fine[i]
          if (fine[i] > max) max = fine[i]
        }
        for (let i = 0; i < N; i++) fine[i] = (fine[i] - min) / (max - min)
      })()
      const SPOTS = (() => {
        let seed = 7
        const rnd = () => {
          seed = (seed * 1664525 + 1013904223) >>> 0
          return seed / 4294967296
        }
        return Array.from({ length: 8 }, () => ({ x: (0.1 + rnd() * 0.8) * W, y: (0.08 + rnd() * 0.84) * H, r: (0.16 + rnd() * 0.2) * W, at: rnd() }))
      })()
      // Each spot's noise-warped distance to every pixel never changes, so it is worked out once.
      for (const s of SPOTS) {
        s.far = new Float32Array(N)
        for (let y = 0, i = 0; y < H; y++)
          for (let x = 0; x < W; x++, i++) s.far[i] = Math.hypot(x - s.x, y - s.y) * (1 + (grain[i] - 0.5) * 0.9 + (fine[i] - 0.5) * 0.5)
      }
      let reachAt = -1
      /** How far the ink has reached at a pixel: 0 dry, 1 soaked. `feather` widens the edge. */
      function bleed(i, x, y, p, feather) {
        if (reachAt !== p) {
          for (const s of SPOTS) s.reach = swell((p + s.at) % 1) * s.r
          reachAt = p
        }
        let best = -Infinity
        for (let k = 0; k < SPOTS.length; k++) {
          const v = SPOTS[k].reach - SPOTS[k].far[i]
          if (v > best) best = v
        }
        return step(-feather, feather, best)
      }

      // Clay windows: a smooth field that drifts and is cut at a level, which is exactly how the type
      // gets its outline. Where the pixel references use a grid, this gives one fluid shape that
      // splits, merges and wanders. The field moves along closed paths, so every loop closes.
      const lattice = (x, y) => {
        const v = Math.sin(x * 127.1 + y * 311.7) * 43758.5453
        return v - Math.floor(v)
      }
      const smooth = (x, y) => {
        const xi = Math.floor(x)
        const yi = Math.floor(y)
        const fx = x - xi
        const fy = y - yi
        const u = fx * fx * (3 - 2 * fx)
        const v = fy * fy * (3 - 2 * fy)
        return (lattice(xi, yi) * (1 - u) + lattice(xi + 1, yi) * u) * (1 - v) + (lattice(xi, yi + 1) * (1 - u) + lattice(xi + 1, yi + 1) * u) * v
      }
      // The field is smooth, so it is worked out on a coarse grid once per frame and read back with
      // interpolation: the same picture at a fraction of the work, which keeps playback fluid.
      const CELL = 6
      const GW = Math.ceil(W / CELL) + 2
      const GH = Math.ceil(H / CELL) + 2
      const fields = new Map()
      function fieldFor(p, scale) {
        let f = fields.get(scale)
        if (!f) fields.set(scale, (f = { at: -1, data: new Float32Array(GW * GH) }))
        if (f.at === p) return f.data
        const a = p * TAU
        const ca = 0.9 * Math.cos(a)
        const sa = 0.9 * Math.sin(a)
        for (let gy = 0, k = 0; gy < GH; gy++) {
          for (let gx = 0; gx < GW; gx++, k++) {
            const u = ((gx * CELL) / W) * scale
            const v = ((gy * CELL) / W) * scale
            f.data[k] = smooth(u + ca, v + sa) * 0.62 + smooth(u * 2.1 + 7 - 0.78 * sa, v * 2.1 + 3 + 0.78 * ca) * 0.38
          }
        }
        f.at = p
        return f.data
      }
      /** A drifting field, 0..1. `scale` is how many lumps fit across the frame. */
      function drift(x, y, p, scale) {
        const d = fieldFor(p, scale)
        const fx = x / CELL
        const fy = y / CELL
        const xi = fx | 0
        const yi = fy | 0
        const u = fx - xi
        const v = fy - yi
        const k = yi * GW + xi
        return (d[k] * (1 - u) + d[k + 1] * u) * (1 - v) + (d[k + GW] * (1 - u) + d[k + GW + 1] * u) * v
      }
      const edge = (v) => step(-0.012, 0.012, v)

      const SKETCHES = [
        {
          group: 'window',
          type: 'ground',
          name: 'Roaming window',
          like: 'After the first reference',
          text: 'Flat ground with type on it. The photo shows through one clay-shaped opening that wanders, and hides the type wherever it passes.',
          px: (i, x, y, p) => {
            const a = p * TAU
            const cx = W * (0.5 + 0.26 * Math.cos(a))
            const cy = H * (0.45 + 0.24 * Math.sin(a * 2))
            const near = 1 - Math.hypot(x - cx, y - cy) / (W * 0.62)
            return [L[i], 0, 0, 1 - edge(near * 0.75 + (drift(x, y, p, 3.2) - 0.5) * 0.9 - 0.42)]
          },
        },
        {
          group: 'window',
          type: 'ground',
          name: 'Opening and closing',
          like: 'After the third reference',
          text: 'Flat ground with type on it. A clay opening grows from the middle, swallowing the type as it spreads, and closes again.',
          px: (i, x, y, p) => {
            const near = 1 - Math.hypot(x - W / 2, (y - H * 0.48) * 0.85) / (W * 0.8)
            return [L[i], 1, 0, 1 - edge(near + (drift(x, y, p, 3.6) - 0.5) * 0.7 - (0.95 - 0.6 * swell(p)))]
          },
        },
        {
          group: 'window',
          type: 'photo',
          name: 'Drifting cover',
          like: 'After the second reference',
          text: 'The type sits on the photo. Flat patches of the ground colour drift across both, covering the type as they go.',
          px: (i, x, y, p) => [L[i], 0, 0, edge(drift(x, y, p, 4.2) - 0.52)],
        },
        {
          group: 'window',
          type: 'ground',
          name: 'Islands',
          like: 'A variation',
          text: 'Flat ground with type on it, and several small openings instead of one. The type shows only between them.',
          px: (i, x, y, p) => [L[i], 1, 0, 1 - edge(drift(x, y, p, 5.5) - 0.6)],
        },
        {
          group: 'bleed',
          name: 'Blur bleed',
          like: 'Your idea',
          text: 'Always in colour. In a few random spots the photo goes soft, spreading and drawing back like breathing, each on its own beat.',
          px: (i, x, y, p) => [L[i] + (clay[i] - L[i]) * bleed(i, x, y, p, 26), 1],
        },
        {
          group: 'bleed',
          name: 'Ink bleed',
          like: 'Colour seeps in',
          text: 'The photo is black and white. Colour seeps out from the spots with a feathered edge and soaks back in.',
          px: (i, x, y, p) => [L[i], bleed(i, x, y, p, 14)],
        },
        {
          group: 'bleed',
          name: 'Wet bleed',
          like: 'Both together',
          text: 'Where the ink reaches, the photo both takes colour and goes soft, as if the paper were wet there.',
          px: (i, x, y, p) => {
            const m = bleed(i, x, y, p, 22)
            return [L[i] + (clay[i] - L[i]) * m, m]
          },
        },
        {
          group: 'bleed',
          name: 'Clay bleed',
          like: 'Bold',
          text: 'The spots have a hard clay edge, and inside them the photo collapses into two flat coloured tones.',
          px: (i, x, y, p) => {
            const m = bleed(i, x, y, p, 3)
            return [L[i] + (step(0.46, 0.54, clay[i]) - L[i]) * m, m]
          },
        },
        {
          group: 'pulse',
          name: 'Colour pulse',
          like: 'The simple one',
          text: 'The whole photo eases from black and white into the gradient map, holds, and eases back. Nothing else changes.',
          px: (i, x, y, p) => [L[i], hold(p)],
        },
        {
          group: 'pulse',
          name: 'Soft pulse',
          like: 'Subtle',
          text: 'The same pulse, but it only ever reaches about half strength, so the photo warms toward the ramp and cools again.',
          px: (i, x, y, p) => [L[i], 0.12 + 0.48 * swell(p)],
        },
        {
          group: 'pulse',
          name: 'Tone rise',
          like: 'Colour arrives through the tones',
          text: 'Colour reaches the shadows first and climbs to the highlights, then drains back the same way.',
          px: (i, x, y, p) => [L[i], step(-0.12, 0.12, swell(p) * 1.3 - 0.15 - soft[i])],
        },
        {
          group: 'pulse',
          name: 'Bloom',
          like: 'From the middle out',
          text: 'Colour opens from the centre with a lumpy clay edge, fills the frame, and closes again.',
          px: (i, x, y, p) => {
            const dx = (x - W / 2) / (W * 0.75)
            const dy = (y - H / 2) / (H * 0.75)
            return [L[i], step(-0.03, 0.03, hold(p) * 1.25 - Math.sqrt(dx * dx + dy * dy) - (grain[i] - 0.5) * 0.35)]
          },
        },
        {
          group: 'pulse',
          name: 'Glaze',
          like: 'Colour runs down like glaze',
          text: 'The gradient map pours from the top with an uneven dripping edge, covers the photo, then drains off the bottom.',
          px: (i, x, y, p) => {
            const drip = (grain[x] - 0.5) * 0.5 + (grain[i] - 0.5) * 0.12
            const top = p * 2.4 - 1.2 + drip
            const bottom = p * 2.4 - 0.2 + drip
            const v = y / H
            return [L[i], step(-0.015, 0.015, bottom - v) * (1 - step(-0.015, 0.015, top - v))]
          },
        },
        {
          group: 'pulse',
          name: 'Ramp swap',
          like: 'Always in colour',
          text: 'No black and white at all: the photo pulses from this ramp to the next one in the list and back.',
          px: (i, x, y, p) => [L[i], 1, hold(p)],
        },
        {
          group: 'bold',
          name: 'Clay bloom',
          like: 'Bold',
          text: 'Black and white collapses into two flat coloured tones with clay edges at the peak, then the photo comes back.',
          px: (i, x, y, p) => {
            const k = hold(p)
            return [L[i] + (step(0.46, 0.54, clay[i]) - L[i]) * k, k]
          },
        },
        {
          group: 'bold',
          name: 'Flip',
          like: 'Bold',
          text: 'The ramp turns inside out: shadows and highlights trade places through a flat middle, and trade back.',
          px: (i, x, y, p) => {
            const k = hold(p)
            return [L[i] + (1 - 2 * L[i]) * k, 1]
          },
        },
        {
          group: 'bold',
          name: 'Heartbeat',
          like: 'Bold',
          text: 'Two quick beats per loop. Each one kicks the photo into hard two-tone colour and lets it fall back to grey.',
          px: (i, x, y, p) => {
            const beat = (c) => Math.exp(-Math.pow((p - c) / 0.045, 2))
            const k = Math.min(1, beat(0.3) + 0.75 * beat(0.46))
            return [L[i] + (step(0.4, 0.6, soft[i]) - L[i]) * k * 0.8, k]
          },
        },
        {
          group: 'bold',
          name: 'Strobe ramps',
          like: 'Boldest',
          text: 'The photo steps through all four ramps in turn, with a short soft cross between each.',
          px: (i, x, y, p) => [L[i], 1, -1 - p],
        },
        {
          group: 'travel',
          name: 'Colour wave',
          like: 'Like Wave',
          text: 'The photo rests in black and white. A soft band crosses it, and inside the band the gradient map comes on.',
          px: (i, x, y, p) => [L[i], band(x, p, 90)],
        },
        {
          group: 'travel',
          name: 'Clay front',
          like: 'Like Wave, with a clay edge',
          text: 'The same crossing, but the edge of the colour is a hard, lumpy outline, the way the type looks after the threshold.',
          px: (i, x, y, p) => [L[i], step(0.48, 0.52, band(x, p, 110) + (grain[i] - 0.5) * 0.7)],
        },
        {
          group: 'travel',
          name: 'Focus pass',
          like: 'The type’s blur, on the photo',
          text: 'Always in colour. Where the band is, the photo goes soft, then sharpens again behind it.',
          px: (i, x, y, p) => {
            const w = band(x, p, 100)
            return [L[i] + (clay[i] - L[i]) * w, 1]
          },
        },
        {
          group: 'travel',
          name: 'Clay pass',
          like: 'The whole type recipe, on the photo',
          text: 'Blur, then threshold: inside the band the photo collapses into two flat tones with clay-shaped edges, then recovers.',
          px: (i, x, y, p) => {
            const w = band(x, p, 100)
            return [L[i] + (step(0.47, 0.53, clay[i]) - L[i]) * w, 1]
          },
        },
        {
          group: 'travel',
          name: 'Breathing clay',
          like: 'Like Breathe',
          text: 'The whole photo leans toward two tones and back. The threshold drifts, so the shapes swell and shrink as it goes.',
          px: (i, x, y, p) => {
            const s = Math.sin(p * Math.PI * 2)
            const level = 0.5 + 0.14 * s
            const amount = 0.45 + 0.4 * (0.5 - 0.5 * Math.cos(p * Math.PI * 2))
            return [L[i] + (step(level - 0.04, level + 0.04, soft[i]) - L[i]) * amount, 1]
          },
        },
        {
          group: 'travel',
          name: 'Tone bands',
          like: 'The boldest one',
          text: 'The ramp is wrapped several times over the tones and slides, so contour bands flow through the photo.',
          px: (i, x, y, p) => {
            const v = soft[i] * 3 + p
            const f = v - Math.floor(v)
            return [f < 0.5 ? f * 2 : 2 - f * 2, 1]
          },
        },
      ]

      const GROUPS = [
        { id: 'window', title: 'New: clay windows', sub: 'From your three references, with one fluid clay shape where they use pixels. The flat colour is the Ground. The type sits under the moving shape, so the shape hides it as it passes.' },
        { id: 'bleed', title: 'Ink bleed', sub: 'The effect soaks in at a few random spots that breathe in and out at different times.' },
        { id: 'pulse', title: 'Pulses', sub: 'The effect comes over the whole photo and goes again. Quiet to moderate.' },
        { id: 'bold', title: 'Bold pulses', sub: 'The same idea pushed hard.' },
        { id: 'travel', title: 'From the first round: travelling', sub: 'A band crosses the photo, as before. Unchanged.' },
      ]
      const host = document.getElementById('groups')
      const views = []
      let number = 0
      for (const g of GROUPS) {
        const h = document.createElement('h2')
        h.textContent = g.title
        const sub = document.createElement('p')
        sub.className = 'sub'
        sub.textContent = g.sub
        const grid = document.createElement('div')
        grid.className = 'grid'
        host.append(h, sub, grid)
        for (const s of SKETCHES.filter((k) => k.group === g.id)) {
          const fig = document.createElement('figure')
          const canvas = document.createElement('canvas')
          canvas.width = W
          canvas.height = H
          const cap = document.createElement('figcaption')
          cap.innerHTML = `<b>${++number}. ${s.name}</b><i>${s.like}</i><p>${s.text}</p>`
          fig.append(canvas, cap)
          grid.append(fig)
          const ctx = canvas.getContext('2d')
          views.push({ ...s, canvas, ctx, image: ctx.createImageData(W, H) })
        }
      }

      // Only sketches on screen are drawn, so adding more does not slow the ones being looked at.
      const seen = new Set()
      const watch = new IntersectionObserver((entries) => {
        for (const e of entries) e.isIntersecting ? seen.add(e.target) : seen.delete(e.target)
      })
      views.forEach((v) => watch.observe(v.canvas))

      const lerp = (a, b, t) => a + (b - a) * t

      // Type for the window sketches: plain bold here, a stand-in for the clay type the tool makes.
      const typeMask = new Float32Array(N)
      function setType() {
        const c = document.createElement('canvas')
        c.width = W
        c.height = H
        const ctx = c.getContext('2d', { willReadFrequently: true })
        const size = W * 0.235
        ctx.font = `700 ${size}px 'Instrument Sans'`
        ctx.letterSpacing = `${-size * 0.06}px`
        ctx.fillStyle = '#fff'
        ctx.textBaseline = 'alphabetic'
        ;['Open', 'call', '2027'].forEach((line, k) => ctx.fillText(line, W * 0.07, H * 0.62 + k * size * 0.8))
        const d = ctx.getImageData(0, 0, W, H).data
        for (let i = 0; i < N; i++) typeMask[i] = d[i * 4 + 3] / 255
      }
      function draw(phase, all = false) {
        const at = RAMPS.indexOf(ramp)
        for (const v of views) {
          if (!all && !seen.has(v.canvas)) continue
          const d = v.image.data
          for (let y = 0, i = 0; y < H; y++) {
            for (let x = 0; x < W; x++, i++) {
              const r = v.px(i, x, y, phase)
              const t = clamp(r[0])
              const colour = r[1]
              let a = ramp
              let b = ramp
              let m = 0
              if (r[2] > 0) {
                b = RAMPS[(at + 1) % RAMPS.length]
                m = r[2]
              } else if (r[2] < 0) {
                // Negative values walk the whole list once per loop: -1 - phase.
                const pos = (-r[2] - 1) * RAMPS.length
                const k = Math.floor(pos)
                a = RAMPS[(at + k) % RAMPS.length]
                b = RAMPS[(at + k + 1) % RAMPS.length]
                m = step(0.7, 1, pos - k)
              }
              const g = t * 255
              const o = i * 4
              const cover = r[3] || 0
              // The type belongs to one layer and the moving shape is the other, so the shape hides it.
              const ink = v.type ? typeMask[i] * (v.type === 'ground' ? cover : 1 - cover) : 0
              const inkTone = v.type === 'photo' || ground[0] * 0.299 + ground[1] * 0.587 + ground[2] * 0.114 < 110 ? 255 : 0
              for (let c = 0; c < 3; c++) {
                const lo = lerp(a.lo[c], b.lo[c], m)
                const hi = lerp(a.hi[c], b.hi[c], m)
                const px = g + (lo + (hi - lo) * t - g) * colour
                const board = px + (ground[c] - px) * cover
                d[o + c] = board + (inkTone - board) * ink
              }
              d[o + 3] = 255
            }
          }
          v.ctx.putImageData(v.image, 0, 0)
        }
      }

      // Controls
      const rampBox = document.getElementById('ramps')
      RAMPS.forEach((r) => {
        const b = document.createElement('button')
        b.type = 'button'
        b.textContent = r.id
        b.setAttribute('aria-pressed', String(r === ramp))
        b.onclick = () => {
          ramp = r
          rampBox.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
          if (!playing) draw(phase, true)
        }
        rampBox.append(b)
      })

      const groundBox = document.getElementById('grounds')
      GROUNDS.forEach((g) => {
        const b = document.createElement('button')
        b.type = 'button'
        b.textContent = g.id
        b.setAttribute('aria-pressed', String(g.rgb === ground))
        b.onclick = () => {
          ground = g.rgb
          groundBox.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
          if (!playing) draw(phase, true)
        }
        groundBox.append(b)
      })

      let playing = !matchMedia('(prefers-reduced-motion: reduce)').matches
      let phase = playing ? 0 : 0.45
      let last = performance.now()
      const speed = document.getElementById('speed')
      const play = document.getElementById('play')
      const label = () => (play.textContent = playing ? 'Pause' : 'Play')
      play.onclick = () => {
        playing = !playing
        last = performance.now()
        label()
      }
      label()

      function tick(now) {
        if (playing) {
          phase = (phase + ((now - last) / 1000 / LOOP) * Number(speed.value)) % 1
          draw(phase)
        }
        last = now
        requestAnimationFrame(tick)
      }

      document.getElementById('file').onchange = (e) => {
        const f = e.target.files[0]
        if (!f) return
        const img = new Image()
        img.onload = () => {
          setPhoto(img)
          draw(phase, true)
          URL.revokeObjectURL(img.src)
        }
        img.src = URL.createObjectURL(f)
      }

      const sample = new Image()
      sample.onload = async () => {
        setPhoto(sample)
        // The bold face has to be in before the type can be drawn into its mask.
        await document.fonts.load("700 80px 'Instrument Sans'").catch(() => {})
        setType()
        draw(phase, true)
        requestAnimationFrame(tick)
      }
      sample.src = 'sample.webp'
      window.__sketch = { draw, views, setPhase: (p) => ((phase = p), draw(p, true)) }
    </script>
  </body>
</html>
